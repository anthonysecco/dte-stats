[project]
name = "dte-stats"
version = "0.1.0"
description = "Home Assistant integration for DTE Energy usage, costs and time-of-day prices from the Green Button data link"
requires-python = ">=3.13"
license = "MIT"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # generated XML strings

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true
