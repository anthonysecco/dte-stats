name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Never paste your usage data link here: anyone with it can see your usage. Diagnostics leave it out."
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected and what you saw instead. Include entity IDs and states.
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      placeholder: "2026.10.4"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DTE Energy integration version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant lines from Settings → System → Logs (enable debug logging for custom_components.dte_stats if you can).
      render: text
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Drag in the file from Settings → Devices & services → DTE Energy → ⋮ → Download diagnostics.
